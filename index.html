<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI C11 · Download</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <style>
    :root {
      --panel: rgba(14, 20, 28, 0.92);
      --line: rgba(94, 234, 212, 0.28);
      --text: #e8eef5;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(900px 480px at 12% -10%, rgba(45,212,191,.18), transparent 55%),
        radial-gradient(700px 420px at 90% 0%, rgba(56,189,248,.12), transparent 50%),
        linear-gradient(165deg, #05070a, #0b1220 50%, #071018);
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 48px 18px 64px; }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .brand {
      font-size: clamp(2rem, 5vw, 2.8rem); font-weight: 800; letter-spacing: .12em;
      color: #5eead4; text-transform: uppercase; margin: 0;
    }
    .sub { color: var(--muted); letter-spacing: .28em; font-size: .72rem; margin: 8px 0 0; text-transform: uppercase; }
    .lang { display: flex; gap: 6px; }
    .lang button {
      border: 1px solid rgba(148,163,184,.35); background: transparent; color: #cbd5e1;
      border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: .8rem;
    }
    .lang button.on { border-color: rgba(45,212,191,.55); color: #99f6e4; }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      padding: 22px; margin: 28px 0 0; box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }
    .card h2 { margin: 0 0 8px; font-size: 1.05rem; }
    .hint { color: var(--muted); font-size: .88rem; margin: 0 0 16px; line-height: 1.55; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; border: 0; cursor: pointer;
      padding: 12px 18px; border-radius: 12px; font-size: 1rem; font-weight: 700;
      background: linear-gradient(90deg, #0d9488, #0891b2); color: #fff; text-decoration: none;
    }
    .btn:hover { filter: brightness(1.08); }
    .meta { margin-top: 12px; color: var(--muted); font-size: .8rem; font-family: ui-monospace, Consolas, monospace; }
    #boot {
      position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 40%, #12263a, #05070a 70%);
    }
    #boot .t { font-size: 2rem; font-weight: 800; letter-spacing: .18em; color: #5eead4; }
  </style>
</head>
<body>
  <div id="boot"><div class="t">AI C11</div></div>
  <div class="wrap" id="app" style="opacity:0">
    <div class="top">
      <div>
        <h1 class="brand">AI C11</h1>
        <p class="sub" data-i18n="sub">Download</p>
      </div>
      <div class="lang">
        <button type="button" id="btn-zh" class="on">中文</button>
        <button type="button" id="btn-en">EN</button>
      </div>
    </div>
    <div class="card" data-anim>
      <h2 data-i18n="title">单文件程序</h2>
      <p class="hint" data-i18n="hint">从 GitHub 下载 ZIP（内含 NiceGUIFPS.exe）。模型与 Ghub.dll 已打包进程序，解压后直接运行即可。</p>
      <a class="btn" id="btn-pack" href="#" data-i18n="btn">从 GitHub 下载</a>
      <div class="meta" id="meta">GitHub Releases</div>
    </div>
  </div>
  <script>
    // 发布后由脚本写入最新 Release 资源地址
    const DOWNLOAD_URL = window.AIC11_DOWNLOAD_URL || 'https://github.com/AC11-AI/niceguifps-download/releases/latest/download/NiceGUIFPS_Pack.zip';
    const I18N = {
      zh: {
        sub: '下载中心',
        title: '单文件程序',
        hint: '从 GitHub 下载 ZIP（内含 NiceGUIFPS.exe）。模型与 Ghub.dll 已打包进程序，解压后直接运行即可。',
        btn: '从 GitHub 下载'
      },
      en: {
        sub: 'Download',
        title: 'Single EXE',
        hint: 'Download the ZIP from GitHub (NiceGUIFPS.exe inside). Models and Ghub.dll are embedded — extract and run.',
        btn: 'Download from GitHub'
      }
    };
    let lang = localStorage.getItem('aic11_dl_lang');
    if (lang !== 'zh' && lang !== 'en') {
      lang = (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
    }
    function applyLang() {
      const t = I18N[lang];
      document.querySelectorAll('[data-i18n]').forEach((el) => {
        const k = el.getAttribute('data-i18n');
        if (t[k]) el.textContent = t[k];
      });
      document.getElementById('btn-zh').classList.toggle('on', lang === 'zh');
      document.getElementById('btn-en').classList.toggle('on', lang === 'en');
      localStorage.setItem('aic11_dl_lang', lang);
    }
    document.getElementById('btn-zh').onclick = () => { lang = 'zh'; applyLang(); };
    document.getElementById('btn-en').onclick = () => { lang = 'en'; applyLang(); };
    applyLang();
    const btn = document.getElementById('btn-pack');
    btn.href = DOWNLOAD_URL;
    document.getElementById('meta').textContent = DOWNLOAD_URL;
    const g = window.gsap;
    const boot = document.getElementById('boot');
    const app = document.getElementById('app');
    setTimeout(() => {
      if (g) {
        g.to(boot, { opacity: 0, duration: 0.35, onComplete: () => boot.style.display = 'none' });
        g.to(app, { opacity: 1, duration: 0.4, delay: 0.08 });
      } else {
        boot.style.display = 'none';
        app.style.opacity = 1;
      }
    }, 400);
  </script>
</body>
</html>
