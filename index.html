<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI C11 · Download</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <style>
    :root {
      --panel: rgba(14, 20, 28, 0.92);
      --line: rgba(94, 234, 212, 0.28);
      --text: #e8eef5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(900px 480px at 12% -10%, rgba(45,212,191,.18), transparent 55%),
        radial-gradient(700px 420px at 90% 0%, rgba(56,189,248,.12), transparent 50%),
        linear-gradient(165deg, #05070a, #0b1220 50%, #071018);
    }
    .wrap {
      max-width: 640px; margin: 0 auto; min-height: 100vh;
      padding: 48px 18px; display: flex; flex-direction: column; justify-content: center;
    }
    .brand {
      font-size: clamp(2rem, 5vw, 2.8rem); font-weight: 800; letter-spacing: .12em;
      color: #5eead4; text-transform: uppercase; margin: 0 0 28px;
    }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      padding: 28px; box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      border: 0; cursor: pointer; text-decoration: none;
      padding: 14px 28px; border-radius: 12px; font-size: 1.05rem; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
      background: linear-gradient(90deg, #0d9488, #0891b2); color: #fff;
    }
    .btn:hover { filter: brightness(1.08); }
    #boot {
      position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 40%, #12263a, #05070a 70%);
    }
    #boot .t { font-size: 2rem; font-weight: 800; letter-spacing: .18em; color: #5eead4; }
  </style>
</head>
<body>
  <div id="boot"><div class="t">AI C11</div></div>
  <div class="wrap" id="app" style="opacity:0">
    <h1 class="brand">AI C11</h1>
    <div class="card" data-anim>
      <a class="btn" id="btn-pack" href="#">Download</a>
    </div>
  </div>
  <script>
    const DOWNLOAD_URL = window.AIC11_DOWNLOAD_URL || 'https://github.com/AC11-AI/niceguifps-download/releases/latest/download/NiceGUIFPS_Pack.zip';
    document.getElementById('btn-pack').href = DOWNLOAD_URL;
    const g = window.gsap;
    const boot = document.getElementById('boot');
    const app = document.getElementById('app');
    setTimeout(() => {
      if (g) {
        g.to(boot, { opacity: 0, duration: 0.35, onComplete: () => boot.style.display = 'none' });
        g.to(app, { opacity: 1, duration: 0.4, delay: 0.08 });
        g.from('[data-anim]', { y: 14, opacity: 0, duration: 0.4, delay: 0.12, clearProps: 'all' });
      } else {
        boot.style.display = 'none';
        app.style.opacity = 1;
      }
    }, 400);
  </script>
</body>
</html>
